# HTTP → HTTPS redirect (TLS is mandatory: admin credentials and license
# data must never cross the LAN in cleartext). /health stays on plain HTTP
# for container-side probes.
server {
    listen 80 default_server;
    server_name _;

    server_tokens off;

    location = /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Redirect to the external TLS port (compose maps ${FRONTEND_TLS_PORT:-23443}
    # → 443). $host lacks the port and $http_host carries the HTTP port, so
    # strip any incoming port and append the TLS one explicitly.
    if ($http_host ~ "^(?<ns_hname>[^:]+)(?::[0-9]+)?$") {
        return 301 https://$ns_hname:23443$request_uri;
    }
    location / {
        return 301 https://$host:23443$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Per-install self-signed certificate generated by bootstrap/install
    # (deployment/config/tls/). Mounted read-only into the container.
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 10m;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health {
        access_log off;
        return 200 "healthy\n";
    }

    location /api/ {
        # Re-resolve at request time: Docker's embedded DNS + variable proxy_pass.
        # Static "proxy_pass http://backend:8000" caches the backend container IP at
        # nginx startup — any backend recreate leaves nginx proxying to a dead IP (502).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Serve Vite build assets/ directory directly (never fallback to SPA)
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — no $uri/ so client-side /assets route doesn't 301 into the static dir
    location / {
        try_files $uri /index.html;
    }
}
