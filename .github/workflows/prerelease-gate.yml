name: Pre-release Distribution Gate

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

jobs:
  gate-check:
    name: Run Pre-release Validation Gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema pyyaml

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Install Minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Execute Pre-release Gate
        run: |
          chmod +x ci/prerelease-gate.sh
          ./ci/prerelease-gate.sh
