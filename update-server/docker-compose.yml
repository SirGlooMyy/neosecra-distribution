# NeoSecra Update Server
# Serves release artifacts via Caddy with automatic HTTPS.
# /srv/update can later be changed to a host path (e.g. /data/update)
# so the www directory lives outside the compose project.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - ./ca:/etc/caddy/ca:ro
      - ./www:/srv/update:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
