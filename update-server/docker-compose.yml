# NeoSecra Update Server
# Serves release artifacts via Caddy with automatic HTTPS.
# /srv/update can later be changed to a host path (e.g. /data/update)
# so the www directory lives outside the compose project.
#
# TLS mode selection:
#   CADDY_MODE=internal     -> Static certificate mode (default Caddyfile now
#                              uses the Cloudflare Origin CA pair).
#                              CADDY_CERTS_DIR must contain the selected key.
#   CADDY_MODE=public       -> Let's Encrypt (auto-provision, Caddyfile.public)

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Router port-forward ic portlari — hostname -> LAN:944X.
      # Tum arayuzlere bagli (0.0.0.0): LAN'daki router bu portlara forward eder.
      - "9445:9445"
      - "9446:9446"
      - "9447:9447"
      # Geri donus plani (eski public davranis; Cloudflare gecis oncesi):
      # - "80:80"
      # - "443:443"
    volumes:
      # CADDYFILE: selectable via env; default is the Cloudflare Origin config.
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      # Cloudflare Origin mode: set CADDY_CERTS_DIR to the root-owned secret
      # directory containing neosecra-origin.crt (0644) and
      # neosecra-origin.key (0600).  The ./certs default is retained only for
      # local legacy/custom-CA runs with an explicitly selected Caddyfile.
      - ${CADDY_CERTS_DIR:-./certs}:/etc/caddy/certs:ro
      - ${CADDY_CA_DIR:-./ca}:/etc/caddy/ca:ro
      - ./www:/srv/update:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_MODE=${CADDY_MODE:-internal}

  # Docker Registry — image'lar artik kendi sunucumuzdan (ghcr bagimliligi yok).
  # Caddy registry.neosecra.com vhost'u ile disari TLS'li acilir.
  # 127.0.0.1:5000 yalnizca host-local bakim icindir; dis istemciler TLS vhost'unu kullanir.
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"

volumes:
  registry_data:
  caddy_data:
  caddy_config:
